<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Happy 20th Birthday, Euodia Natalina Siagian! ✨</title>
    <meta name="description" content="A cinematic, dedicated 3D birthday celebration made exclusively with love for Euodia Natalina Siagian.">
    <meta name="theme-color" content="#120616">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">

    <!-- Open Graph previews -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Happy Birthday Euodia">
    <meta property="og:title" content="Happy Birthday, Euodia Natalina Siagian! 💖">
    <meta property="og:description" content="A little surprise made just for you. Open it, turn on the lights, and make a wish.">
    <meta property="og:image" content="/photos/euodia-01.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Happy Birthday, Euodia Natalina Siagian! 💖">
    <meta name="twitter:description" content="A little surprise made just for you. Open it, turn on the lights, and make a wish.">

    <!-- Self-hosted UI fonts -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2">
    <link rel="stylesheet" href="/src/styles/fonts.css">
</head>
<body class="theme-neon-rose">
    <div id="app">
        <!-- SPA View Container: Dedicated Receiver Experience for Euodia -->
        <main id="receiver-view" class="view-panel rcv active-view">
            <!-- Language switcher (hidden for personal dedicated experience) -->
            <div class="rcv-lang" style="display: none;" aria-hidden="true">
                <i class="fa-solid fa-globe" aria-hidden="true"></i>
                <select id="lang-switcher-receiver" class="rcv-lang-select" aria-label="Language">
                    <option value="en" selected>EN</option>
                    <option value="th">TH</option>
                    <option value="ja">JA</option>
                </select>
            </div>

            <!-- 1. PERSONALIZED OPENING SCENE (Envelope Gate & Countdown) -->
            <div id="envelope-gate" class="rcv-gate active-gate euodia-gate">
                <div class="ambient-glow-orb orb-1" aria-hidden="true"></div>
                <div class="ambient-glow-orb orb-2" aria-hidden="true"></div>

                <div class="euodia-gate-container">
                    <!-- LIVE BIRTHDAY COUNTDOWN -->
                    <div class="countdown-wrapper" id="birthday-countdown-wrap">
                        <div class="countdown-grid">
                            <div class="countdown-tile">
                                <span class="countdown-num" id="count-days">00</span>
                                <span class="countdown-label">DAYS</span>
                            </div>
                            <div class="countdown-tile">
                                <span class="countdown-num" id="count-hours">00</span>
                                <span class="countdown-label">HOURS</span>
                            </div>
                            <div class="countdown-tile">
                                <span class="countdown-num" id="count-minutes">00</span>
                                <span class="countdown-label">MINUTES</span>
                            </div>
                            <div class="countdown-tile">
                                <span class="countdown-num" id="count-seconds">00</span>
                                <span class="countdown-label">SECONDS</span>
                            </div>
                        </div>
                        <p class="countdown-status-msg" id="count-message">Something special is waiting for you, Euodia.</p>
                    </div>

                    <!-- SURPRISE BUTTON: Revealed strictly after countdown finishes -->
                    <div class="surprise-action-wrap" id="surprise-action-wrap" hidden>
                        <button type="button" id="btn-open-envelope" class="euodia-open-btn" data-state="ready">
                            <span class="btn-shimmer" aria-hidden="true"></span>
                            <span class="rcv-open-spinner" aria-hidden="true"></span>
                            <span id="rcv-open-label">OPEN YOUR SURPRISE</span>
                            <span class="rcv-open-progress" aria-hidden="true"><span id="rcv-open-bar"></span></span>
                        </button>
                        <button type="button" id="btn-open-quiet" class="euodia-quiet-btn">Open quietly (without sound)</button>
                    </div>

                    <span id="rcv-seal-initial" style="display:none;">E</span>
                    <p class="rcv-gate-sound" id="rcv-gate-sound" style="display:none;"></p>
                </div>
            </div>

            <!-- Poster mode: baked stills while room streams or on low-end devices -->
            <div id="rcv-poster" class="rcv-poster" aria-hidden="true" hidden>
                <img id="rcv-poster-dark" class="rcv-poster-img rcv-poster-img-dark" alt="" decoding="async">
                <img id="rcv-poster-lit" class="rcv-poster-img rcv-poster-img-lit" alt="" decoding="async">
            </div>

            <!-- 2. 3D CINEMATIC STAGE -->
            <div id="greeting-canvas-container" class="rcv-stage"></div>

            <!-- 3. HEADS-UP DISPLAY (Instructions, Switch, Lyrics, Audio Controls) -->
            <div class="rcv-hud" id="rcv-hud" inert>
                <p class="rcv-title" id="rcv-title"></p>

                <!-- Glowing light switch in the dark room -->
                <button type="button" id="rcv-switch" class="rcv-switch" hidden>
                    <span class="rcv-switch-ring" aria-hidden="true"></span>
                    <i class="fa-solid fa-hand-pointer rcv-switch-hand" aria-hidden="true"></i>
                </button>
                <p id="rcv-dark-hint" class="rcv-dark-hint" aria-live="polite" hidden></p>
                <button type="button" id="btn-dark-skip" class="rcv-link-btn rcv-dark-skip" hidden></button>
                <p id="rcv-surprise" class="rcv-surprise" aria-hidden="true"></p>
                <p id="rcv-cake-coming" class="rcv-cake-coming" hidden></p>
                
                <div id="rcv-lyrics" class="rcv-lyrics" hidden>
                    <p id="rcv-lyric-line" aria-live="off"></p>
                    <button type="button" id="btn-skip-song" class="rcv-link-btn rcv-skip-song" hidden></button>
                </div>
                <p id="rcv-live" class="rcv-sr" aria-live="assertive"></p>

                <div class="rcv-controls">
                    <button type="button" id="btn-hud-audio" class="rcv-hud-btn" aria-pressed="true">
                        <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
                        <span class="rcv-hud-label" id="rcv-audio-label"></span>
                    </button>
                    <button type="button" id="btn-hud-card" class="rcv-hud-btn" hidden>
                        <i class="fa-solid fa-envelope-open-text" aria-hidden="true"></i>
                        <span class="rcv-hud-label" id="rcv-card-label"></span>
                    </button>
                    <button type="button" id="btn-hud-reset" class="rcv-hud-btn" hidden>
                        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                        <span class="rcv-hud-label" id="rcv-reset-label"></span>
                    </button>
                </div>

                <div class="rcv-wish" id="rcv-wish" hidden>
                    <div class="rcv-breath" aria-hidden="true"></div>
                    <p id="rcv-wish-text" class="rcv-wish-text" aria-live="polite"></p>
                    <button type="button" id="btn-wish-ready" class="rcv-btn rcv-btn-gold" hidden></button>
                </div>

                <div class="rcv-candles2d" id="rcv-candles2d" hidden></div>

                <!-- Candle blowing HUD (mic or touch) -->
                <div class="rcv-blow" id="rcv-blow" hidden>
                    <div class="rcv-pill">
                        <span class="rcv-pill-icon" aria-hidden="true"><i class="fa-solid fa-hand-pointer" id="rcv-pill-icon"></i></span>
                        <p id="instruction-text" aria-live="polite"></p>
                        <span class="rcv-count" id="rcv-count"></span>
                    </div>
                    <div class="rcv-meter" id="mic-visualizer" hidden><span id="mic-bar"></span></div>
                    <button type="button" id="btn-hud-mic" class="rcv-link-btn" hidden>
                        <i class="fa-solid fa-microphone" aria-hidden="true"></i>
                        <span id="rcv-mic-label"></span>
                    </button>
                    <a id="rcv-mic-external" class="rcv-link-btn" hidden>
                        <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
                        <span id="rcv-mic-external-label"></span>
                    </a>
                </div>

                <div class="rcv-mic-sheet" id="rcv-mic-sheet" role="dialog" aria-modal="false" aria-labelledby="rcv-mic-explain" hidden>
                    <p id="rcv-mic-explain"></p>
                    <div class="rcv-row">
                        <button type="button" id="btn-mic-use" class="rcv-btn rcv-btn-gold"></button>
                        <button type="button" id="btn-mic-tap" class="rcv-btn rcv-btn-ghost"></button>
                    </div>
                </div>
            </div>

            <!-- 4. BIRTHDAY MESSAGE SHEET, PHOTO GALLERY & FINALE -->
            <section id="rcv-card" class="rcv-card" role="dialog" aria-modal="false" aria-labelledby="view-title" inert aria-hidden="true">
                <div class="rcv-card-handle" aria-hidden="true"></div>
                <button type="button" id="btn-close-greeting-card" class="rcv-close">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    <span class="rcv-sr" id="rcv-card-close-label">Close</span>
                </button>
                
                <div class="rcv-card-scroll">
                    <p class="rcv-card-to" id="rcv-card-to"></p>
                    <p id="view-date" class="rcv-card-date"></p>
                    <img id="rcv-card-photo" class="rcv-card-photo" alt="" referrerpolicy="no-referrer" hidden>
                    
                    <div class="rcv-card-text" id="rcv-card-text">
                        <h2 id="view-title" tabindex="-1"></h2>
                        <p id="view-message" class="rcv-card-message"></p>
                        <p class="rcv-card-signature" id="rcv-card-signature"></p>
                    </div>

                    <button type="button" id="btn-read-letter" class="rcv-btn rcv-btn-letter" hidden></button>

                    <!-- DEDICATED 10-PHOTO GALLERY: A LITTLE GALLERY OF YOU -->
                    <section id="photo-gallery-container" class="gallery-section-wrap"></section>

                    <!-- FINAL CELEBRATION & MESSAGE BANNER -->
                    <div class="final-celebration-banner">
                        <h3 class="final-title">HAPPY BIRTHDAY, EUODIA.</h3>
                        <p class="final-quote">May your days always be as beautiful as your heart.</p>
                        <p class="final-sender">With love, from your bf.</p>
                        <button type="button" id="btn-final-replay" class="final-replay-btn">
                            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> EXPERIENCE IT AGAIN
                        </button>
                    </div>

                    <!-- End actions -->
                    <div class="rcv-end">
                        <button type="button" id="btn-thanks" class="rcv-btn rcv-btn-gold"></button>
                        <div class="rcv-end-row">
                            <button type="button" id="btn-replay" class="rcv-end-btn">
                                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span id="rcv-replay-label">Replay</span>
                            </button>
                            <button type="button" id="btn-save-photo" class="rcv-end-btn">
                                <i class="fa-solid fa-camera" aria-hidden="true"></i><span id="rcv-save-label">Save Card Photo</span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 5. PERSONAL SECRET LETTER (Parment Popup Envelope) -->
            <div id="letter-popup-overlay" class="letter-overlay-gate" role="dialog" aria-modal="true" aria-labelledby="letter-popup-title" inert>
                <div class="letter-popup-wrapper">
                    <button type="button" id="btn-close-letter" class="letter-close-btn">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                        <span class="rcv-sr" id="rcv-letter-close-label">Close</span>
                    </button>
                    <div class="letter-open-hint" id="letter-open-hint">
                        <i class="fa-solid fa-envelope-open-text" aria-hidden="true"></i>
                        <span>Tap the wax seal or envelope to read the message</span>
                    </div>
                    <div class="interactive-envelope" id="letter-envelope-container" role="button" tabindex="0">
                        <div class="envelope-back"></div>
                        <div class="envelope-paper" id="letter-paper">
                            <div class="letter-stamp-seal"><i class="fa-solid fa-heart" aria-hidden="true"></i></div>
                            <div class="letter-inner-content">
                                <h2 id="letter-popup-title"></h2>
                                <div class="letter-body-scroll">
                                    <div id="letter-popup-body" aria-hidden="true"></div>
                                    <p id="letter-popup-sr" class="rcv-sr" aria-live="polite"></p>
                                </div>
                            </div>
                        </div>
                        <div class="envelope-front"></div>
                        <div class="envelope-flap" id="letter-envelope-flap"></div>
                    </div>
                </div>
            </div>

            <!-- Lightbox for Photo Gallery -->
            <div id="gallery-lightbox" class="gallery-lightbox" role="dialog" aria-modal="true" hidden></div>

            <!-- Photo preview for in-app browsers -->
            <div id="rcv-photo-preview" class="rcv-photo-preview" role="dialog" aria-modal="true" aria-labelledby="rcv-photo-hint" hidden>
                <img id="rcv-photo-img" alt="">
                <p id="rcv-photo-hint"></p>
                <button type="button" id="btn-photo-close" class="rcv-btn rcv-btn-ghost"></button>
            </div>

            <div class="rcv-bubbles" id="rcv-bubbles" aria-live="polite"></div>
        </main>
    </div>

    <!-- Main Module Entry -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
